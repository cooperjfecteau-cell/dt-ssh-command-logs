name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two runtimes ActiveGate ships. 3.10 loses support on 2026-10-26.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "dt-extensions-sdk[cli]" paramiko pytest

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "dt-extensions-sdk[cli]" paramiko

      - name: Generate throwaway signing certificates
        # CI proves the package assembles and signs. A release build is signed with the
        # real developer certificate, which never lives in this repository.
        run: dt-sdk gencerts

      - name: Build
        run: dt-sdk build -e manylinux2014_x86_64 -p 3.10 -p 3.14

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error
